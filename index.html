<!doctype html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="لیست بدهی‌ها">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>لیست بدهی‌ها</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.app{max-width:560px;margin:auto;padding:20px 16px 32px}header{position:relative;background:#fff;border-radius:22px;padding:20px;box-shadow:0 6px 24px #0000000d;margin-bottom:16px;padding-left:64px}h1{margin:0 0 8px;font-size:25px}.sub{color:#68727d;font-size:14px}.progress{margin-top:16px;background:#edf0f2;height:9px;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#24a148;border-radius:99px;transition:.25s}.summary{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:#59636d}.edit-btn{position:absolute;left:14px;top:14px;width:42px;height:42px;border:0;border-radius:13px;background:#f0f3f5;color:#26323c;font-size:22px;cursor:pointer}.edit-btn:active{transform:scale(.96)}section{background:#fff;border-radius:20px;margin:14px 0;overflow:hidden;box-shadow:0 5px 20px #0000000a}.section-title{padding:15px 18px;font-size:17px;font-weight:700;background:#fafbfc;border-bottom:1px solid #edf0f2}.item{display:flex;align-items:center;gap:13px;padding:16px 18px;border-bottom:1px solid #edf0f2;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.item:last-child{border-bottom:0}.item input{position:absolute;opacity:0;pointer-events:none}.box{width:27px;height:27px;border:2px solid #aeb7bf;border-radius:8px;display:grid;place-items:center;flex:0 0 27px;transition:.18s}.box:after{content:"✓";font-size:19px;color:white;transform:scale(0);transition:.15s}.item.done .box{background:#24a148;border-color:#24a148}.item.done .box:after{transform:scale(1)}.name{font-size:16px;transition:.18s}.item.done .name{text-decoration:line-through;color:#89939c}.reset{width:100%;border:0;border-radius:15px;padding:14px;background:#fff;color:#c62828;font-size:15px;font-weight:600;box-shadow:0 5px 20px #0000000a}.hint{text-align:center;color:#8a949d;font-size:12px;margin-top:14px}.modal-backdrop{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:20}.modal-backdrop.show{display:flex}.modal{width:min(560px,100%);background:#fff;border-radius:24px;padding:18px;box-shadow:0 20px 60px #0005}.modal h2{font-size:19px;margin:0 0 14px}.menu-btn{width:100%;border:0;background:#f5f7f8;border-radius:15px;padding:15px;margin:5px 0;font-size:16px;text-align:right;cursor:pointer}.menu-btn:active{transform:scale(.99)}.menu-btn.danger{color:#c62828}.close-btn{width:100%;border:0;background:transparent;color:#68727d;padding:12px;font-size:15px}.form-row{display:flex;gap:8px;flex-direction:column;margin:10px 0}.form-row label{font-size:13px;color:#68727d}.form-row input,.form-row select{width:100%;padding:13px;border:1px solid #d7dde2;border-radius:12px;font-size:16px;background:#fff}.primary{width:100%;border:0;border-radius:14px;padding:14px;background:#17202a;color:#fff;font-size:16px;font-weight:600;margin-top:8px}.cancel{width:100%;border:0;background:#f1f3f5;border-radius:14px;padding:13px;font-size:15px;margin-top:8px}.delete-selected{display:none;margin:10px 0;width:100%;border:0;border-radius:14px;padding:13px;background:#c62828;color:#fff;font-size:15px;font-weight:600}.edit-mode .item{border-right:4px solid #c62828}.edit-mode .item .box{border-color:#c62828}.edit-mode .item .name{text-decoration:none;color:#17202a}.edit-mode .item input{position:static;opacity:1;pointer-events:auto;width:20px;height:20px;accent-color:#c62828}.edit-mode .item .box{display:none}.rename-list .item{cursor:pointer}.rename-list .item::after{content:'✏️';margin-right:auto;font-size:15px}
</style></head><body><div class="app"><header><button class="edit-btn" id="editBtn" type="button" aria-label="ویرایش">✎</button><h1>💳 لیست بدهی‌ها</h1><div class="sub">برای ثبت پرداخت، روی هر مورد بزن.</div><div class="progress"><div class="bar" id="bar"></div></div><div class="summary"><span id="count"></span><span id="percent"></span></div></header><div id="lists"></div><button class="reset" id="reset" type="button">بازنشانی همه تیک‌ها</button><div class="hint">وضعیت پرداخت‌ها روی همین دستگاه ذخیره می‌شود.</div></div>
<div class="modal-backdrop" id="backdrop"><div class="modal" id="modal"></div></div>
<script>
const key="debt-checklist-v2", dataKey="debt-list-data-v1";
const defaultData=[{id:'loans',title:'وام‌ها',items:[['bluebank','بلوبانک'],['sina','بانک سینا'],['home-loan','وام خانگی']]},{id:'installments',title:'قسط‌ها',items:[['hezarnaghsh','هزارنقش'],['fridge','یخچال'],['snapp','اسنپ'],['digipay','دیجی‌پی'],['torob','ترب'],['building','شارژ ساختمان']]}];
let data=JSON.parse(localStorage.getItem(dataKey)||'null')||defaultData.map(s=>({id:s.id,title:s.title,items:s.items.map(x=>({id:x[0],name:x[1]}))}));
let state=JSON.parse(localStorage.getItem(key)||'{}'), mode='menu';
const $=id=>document.getElementById(id), backdrop=$('backdrop'), modal=$('modal');
function save(){localStorage.setItem(dataKey,JSON.stringify(data));localStorage.setItem(key,JSON.stringify(state));}
function render(){const lists=$('lists');lists.innerHTML='';let all=[];data.forEach(sec=>{const section=document.createElement('section');section.innerHTML='<div class="section-title"></div>';section.querySelector('.section-title').textContent=sec.title;sec.items.forEach(it=>{all.push(it);const el=document.createElement('div');el.className='item';el.dataset.id=it.id;el.innerHTML='<input type="checkbox"><span class="box"></span><span class="name"></span>';el.querySelector('.name').textContent=it.name;el.querySelector('input').checked=!!state[it.id];if(state[it.id])el.classList.add('done');el.addEventListener('click',e=>{if(mode==='delete'){if(e.target.tagName!=='INPUT')el.querySelector('input').checked=!el.querySelector('input').checked;updateDeleteButton();return}if(mode==='rename'){renameItem(it.id);return}state[it.id]=!state[it.id];save();render()});section.appendChild(el)});lists.appendChild(section)});const done=all.filter(x=>state[x.id]).length,p=all.length?Math.round(done/all.length*100):0;$('count').textContent=`${done.toLocaleString('fa-IR')} از ${all.length.toLocaleString('fa-IR')} پرداخت شده`;$('percent').textContent=`${p.toLocaleString('fa-IR')}٪`;$('bar').style.width=p+'%';lists.classList.toggle('edit-mode',mode==='delete');if(mode==='delete')document.querySelector('.app').classList.add('edit-mode');else document.querySelector('.app').classList.remove('edit-mode');}
function openMenu(){mode='menu';modal.innerHTML='<h2>ویرایش لیست</h2><button class="menu-btn" id="add">➕ اضافه کردن مورد جدید</button><button class="menu-btn danger" id="del">🗑️ حذف کردن موارد قبلی</button><button class="menu-btn" id="ren">✏️ تغییر نام</button><button class="close-btn" id="close">بستن</button>';backdrop.classList.add('show');$('add').onclick=addForm;$('del').onclick=deleteMode;$('ren').onclick=renameMode;$('close').onclick=closeModal;}
function addForm(){modal.innerHTML='<h2>اضافه کردن مورد جدید</h2><div class="form-row"><label>نام مورد</label><input id="newName" placeholder="مثلاً بیمه یا قسط جدید"></div><div class="form-row"><label>دسته‌بندی</label><select id="newSec"></select></div><button class="primary" id="saveNew">اضافه کردن</button><button class="cancel" id="back">انصراف</button>';const s=$('newSec');data.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.title;s.appendChild(o)});$('saveNew').onclick=()=>{const name=$('newName').value.trim();if(!name){$('newName').focus();return}const sec=data.find(x=>x.id===s.value);sec.items.push({id:'item-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name});save();closeModal();render()};$('back').onclick=openMenu;}
function deleteMode(){mode='delete';modal.innerHTML='<h2>حذف موارد</h2><p style="color:#68727d;font-size:13px;margin-top:0">مواردی را که می‌خواهی حذف شوند تیک بزن.</p><button class="delete-selected" id="deleteSelected">حذف موارد انتخاب‌شده</button><button class="cancel" id="cancelDelete">انصراف</button>';backdrop.classList.add('show');render();updateDeleteButton();$('deleteSelected').onclick=()=>{const ids=[...document.querySelectorAll('.item input:checked')].map(x=>x.closest('.item').dataset.id);if(!ids.length)return;if(!confirm('موارد انتخاب‌شده حذف شوند؟'))return;data.forEach(s=>s.items=s.items.filter(x=>!ids.includes(x.id)));ids.forEach(id=>delete state[id]);save();closeModal();render()};$('cancelDelete').onclick=openMenu;}
function updateDeleteButton(){const b=$('deleteSelected');if(b)b.style.display=document.querySelectorAll('.item input:checked').length?'block':'none';}
function renameMode(){mode='rename';modal.innerHTML='<h2>تغییر نام</h2><p style="color:#68727d;font-size:13px;margin-top:0">روی موردی که می‌خواهی نامش عوض شود بزن.</p><div id="renameList" class="rename-list"></div><button class="cancel" id="cancelRename">انصراف</button>';const list=$('renameList');data.forEach(s=>s.items.forEach(it=>{const b=document.createElement('button');b.className='menu-btn';b.textContent=it.name;b.onclick=()=>renameItem(it.id);list.appendChild(b)}));$('cancelRename').onclick=openMenu;}
function renameItem(id){const it=data.flatMap(s=>s.items).find(x=>x.id===id);if(!it)return;const n=prompt('نام جدید را وارد کن:',it.name);if(n&&n.trim()){it.name=n.trim();save();render();if(mode==='rename')renameMode()} }
function closeModal(){backdrop.classList.remove('show');mode='normal';render()}
$('editBtn').onclick=openMenu;$('reset').onclick=()=>{if(confirm('همه تیک‌ها برداشته شوند؟')){state={};save();render()}};backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal()});render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
